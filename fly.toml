# The arcade: analytics hub + registry. Always on; it is the one machine that
# stays up so the webhook, the prober, and the live dashboards work.
app = "bhc-arcade"
primary_region = "ewr"

[build]

[env]
  DATA_DIR = "/data"
  TZ = "America/New_York"
  PORT = "8080"
  PUBLIC_URL = "https://bhc-arcade.fly.dev"
  GITHUB_ORG = "Big-Head-Club"

[[mounts]]
  source = "arcade_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
