name: Deploy Arcade

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bhc-arcade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app bhc-arcade
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
